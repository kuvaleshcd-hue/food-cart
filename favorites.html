<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Favorites — Food Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:linear-gradient(to bottom right,#828282,#898787); min-height:100vh; font-family:'Inter',sans-serif; }
    .glass { background:rgba(255,255,255,0.15); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.25); }
    .neon-text { background:linear-gradient(90deg,#ff6ec7,#ffd1d1,#ff6ec7); -webkit-background-clip:text; color:transparent; font-weight:700; }
  </style>
</head>
<body class="text-white">
  <nav class="glass p-4 flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-yellow-400 flex items-center justify-center font-extrabold text-white">F</div>
      <h1 class="text-xl font-bold neon-text">My Favorites ❤️</h1>
    </div>
    <div class="flex gap-3">
      <a href="index.html"   class="px-3 py-2 rounded-lg hover:bg-white/10 text-sm">🏠 Home</a>
      <a href="hotels.html"  class="px-3 py-2 rounded-lg hover:bg-white/10 text-sm">🏨 Hotels</a>
      <a href="orders.html"  class="px-3 py-2 rounded-lg hover:bg-white/10 text-sm">📦 Orders</a>
      <a href="profile.html" class="px-3 py-2 rounded-lg hover:bg-white/10 text-sm">👤 Profile</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <div id="favoritesContainer" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Favorites go here -->
    </div>
  </main>

  <footer class="text-center py-6 text-gray-400 text-sm">© Food Cart — Taste the Future 🍴</footer>

  <!-- TOASTS -->
  <div id="toast" class="fixed right-4 bottom-4 z-50 flex flex-col gap-2"></div>

  <script>
    function showToast(msg, timeout=2600){
      const t = document.createElement('div');
      t.className = 'px-4 py-2 rounded-lg glass text-white text-sm transition-opacity duration-300';
      t.textContent = msg;
      document.getElementById('toast').appendChild(t);
      setTimeout(()=>{ t.style.opacity=0; setTimeout(()=>t.remove(),400); }, timeout);
    }

    const container = document.getElementById('favoritesContainer');
    let favorites = JSON.parse(localStorage.getItem('demoFavorites')||'{}');

    function renderFavorites() {
      container.innerHTML = '';
      const favList = Object.values(favorites);

      if(favList.length === 0){
        container.innerHTML=`
          <div class="col-span-full text-center py-20">
            <p class="text-4xl mb-4">🤍</p>
            <p class="text-gray-300 text-lg">No favorites yet.</p>
            <a href="index.html" class="mt-4 inline-block bg-gradient-to-r from-pink-500 to-yellow-400 text-black font-bold px-6 py-2 rounded-full hover:scale-105 transition shadow-lg">Explore Menu</a>
          </div>`;
        return;
      }

      favList.forEach(it => {
        const card = document.createElement('div');
        card.className = 'bg-gradient-to-br from-white/10 to-white/5 rounded-2xl p-3 glass hover:shadow-2xl transform transition';
        card.innerHTML = `
          <div class="relative rounded-lg overflow-hidden">
            <img src="${it.img}" alt="${it.name}" class="w-full h-40 object-cover" loading="lazy"/>
            <div class="absolute left-3 top-3 bg-black/40 px-3 py-1 rounded-full text-sm text-white">${it.restaurant || 'Unknown'}</div>
            <button class="removeFavBtn absolute right-3 top-3 bg-black/40 p-2 rounded-full text-sm hover:scale-110 transition z-10" data-id="${it.id}">
              ❌
            </button>
          </div>
          <div class="mt-3 flex items-center justify-between">
            <div>
              <div class="font-semibold text-white">${it.name}</div>
              <div class="text-sm text-gray-400">From ${it.restaurant || 'Unknown'}</div>
            </div>
            <div class="text-right">
              <div class="font-bold text-yellow-300">₹${it.price}</div>
              <button class="addBtn mt-2 px-3 py-1.5 rounded-lg bg-gradient-to-r from-pink-500 to-yellow-400 text-black font-bold text-sm shadow-md hover:scale-105 transition">Add</button>
            </div>
          </div>`;

        card.querySelector('.removeFavBtn').addEventListener('click', () => {
          delete favorites[it.id];
          localStorage.setItem('demoFavorites', JSON.stringify(favorites));
          showToast(it.name + ' removed from favorites 🤍');
          renderFavorites();
        });

        card.querySelector('.addBtn').addEventListener('click', () => {
          let cart = JSON.parse(localStorage.getItem('demoCart')||'{}');
          if(cart[it.id]) cart[it.id].qty += 1;
          else cart[it.id] = {...it, qty:1};
          localStorage.setItem('demoCart', JSON.stringify(cart));
          showToast(it.name + ' added to cart 🛒');
        });

        container.appendChild(card);
      });
    }

    renderFavorites();
  </script>
</body>
</html>
