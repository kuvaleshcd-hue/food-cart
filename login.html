<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — FoodCart</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#1a0a1e 0%,#2d1040 40%,#1a1a2e 100%);min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:40px 32px;width:100%;max-width:400px;}
    .logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;background:linear-gradient(90deg,#ff6ec7,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;}
    .subtitle{font-size:14px;color:rgba(255,255,255,0.45);margin-bottom:32px;}
    label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);margin-bottom:8px;}
    input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:14px 16px;color:#fff;font-size:15px;outline:none;font-family:'DM Sans',sans-serif;transition:.2s;margin-bottom:16px;}
    input:focus{border-color:#ff6ec7;}
    input::placeholder{color:rgba(255,255,255,0.3);}
    .btn{width:100%;background:linear-gradient(90deg,#f472b6,#facc15);color:#000;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif;}
    .btn:hover{opacity:.9;transform:scale(1.01);}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:10px 14px;font-size:13px;color:#fca5a5;margin-bottom:16px;display:none;}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:rgba(255,255,255,0.3);font-size:13px;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}
    .link{color:#ff6ec7;cursor:pointer;text-decoration:underline;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🍴 FoodCart</div>
    <div class="subtitle">Sign in to order delicious food</div>

    <div id="error-box" class="error"></div>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" />

    <button class="btn" id="loginBtn" onclick="loginUser()">Login</button>

    <div class="divider">or</div>

    <p style="text-align:center;font-size:13px;color:rgba(255,255,255,0.45)">
      Don't have an account?
      <a href="register.html" class="link">Sign up here</a>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyCZQl-RwRK7KPLpVDK8a1WzbptcX8HyBzU",
      authDomain:        "food-cart-login.firebaseapp.com",
      projectId:         "food-cart-login",
      storageBucket:     "food-cart-login.firebasestorage.app",
      messagingSenderId: "1080008629691",
      appId:             "1:1080008629691:web:d9ce40413e8772b250b89e"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'index.html';
    });

    window.loginUser = async function() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errBox   = document.getElementById('error-box');
      const btn      = document.getElementById('loginBtn');

      errBox.style.display = 'none';
      if (!email || !password) {
        errBox.textContent = 'Please enter email and password.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'index.html';
      } catch (err) {
        const msgs = {
          'auth/user-not-found':    'No account found with this email.',
          'auth/wrong-password':    'Incorrect password.',
          'auth/invalid-email':     'Invalid email address.',
          'auth/too-many-requests': 'Too many attempts. Try again later.',
          'auth/invalid-credential':'Invalid email or password.'
        };
        errBox.textContent = msgs[err.code] || err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    };

    // Allow Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.loginUser();
    });
  </script>
</body>
</html>
