<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu — Food Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <style>
    body { font-family:'Poppins',sans-serif; background:linear-gradient(to bottom right,#828282,#898787); min-height:100vh; color:#333; }
    .glass { background:rgba(255,255,255,0.2); backdrop-filter:blur(12px); border:1px solid rgb(255,247,247); color:#efeeee; }
    .neon-text { background:linear-gradient(90deg,#ff6ec7 0%,#ffd1d1 40%,#ff6ec7 100%); -webkit-background-clip:text; color:transparent; font-weight:700; }
    .btn-primary { background:linear-gradient(90deg,#f472b6,#facc15); color:#000; font-weight:600; transition:0.2s; }
    .btn-primary:hover { transform:scale(1.05); }
    .menu-card { transition:0.3s; }
    .menu-card:hover { transform:translateY(-5px); box-shadow:0 10px 20px rgba(255,255,255,0.1); }
  </style>

  <script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, addDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyCZQl-RwRK7KPLpVDK8a1WzbptcX8HyBzU",
      authDomain:        "food-cart-login.firebaseapp.com",
      projectId:         "food-cart-login",
      storageBucket:     "food-cart-login.firebasestorage.app",  // ✅ fixed
      messagingSenderId: "1080008629691",
      appId:             "1:1080008629691:web:d9ce40413e8772b250b89e"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ✅ Auth guard
    onAuthStateChanged(auth, (user) => {
      if(!user) window.location.replace("login.html");
    });

    const params        = new URLSearchParams(window.location.search);
    const hotelId       = params.get("id");
    const menuContainer = document.getElementById("menuContainer");
    const hotelTitle    = document.getElementById("hotelTitle");

    async function loadMenu(){
      if(!hotelId){ menuContainer.innerHTML="<p class='text-red-400'>Invalid hotel ID.</p>"; return; }
      try{
        const hotelSnap = await getDoc(doc(db,"hotels",hotelId));
        if(hotelSnap.exists()){
          hotelTitle.textContent = hotelSnap.data().name || hotelId;
        } else {
          hotelTitle.textContent = "Hotel Not Found"; return;
        }

        const menuSnap = await getDocs(collection(db,"hotels",hotelId,"menu"));
        if(menuSnap.empty){ menuContainer.innerHTML="<p class='text-gray-400'>No menu items available.</p>"; return; }

        menuContainer.innerHTML='';
        menuSnap.forEach(menuDoc=>{
          const item = menuDoc.data();
          const card = document.createElement('div');
          card.className='menu-card glass rounded-2xl p-4 shadow-lg';
          card.innerHTML=`
            <img src="${item.image||''}" alt="${item.name}" class="w-full h-48 object-cover rounded-xl mb-3" loading="lazy"/>
            <h3 class="text-xl font-semibold text-white">${item.name}</h3>
            <p class="text-gray-300 text-sm mb-2">${item.description||''}</p>
            <div class="flex justify-between items-center">
              <span class="text-yellow-300 font-semibold text-lg">₹${item.price}</span>
              <button class="add-to-cart btn-primary px-4 py-1.5 rounded-lg text-sm">Add to Cart</button>
            </div>`;
          menuContainer.appendChild(card);
        });

        attachCartLogic();
        requestAnimationFrame(()=>{
          gsap.set('.menu-card',{opacity:0,y:30});
          gsap.to('.menu-card',{opacity:1,y:0,stagger:0.1,duration:0.5,ease:'power2.out'});
        });

      } catch(err){
        console.error(err);
        menuContainer.innerHTML="<p class='text-red-400'>Failed to load menu. Try again later.</p>";
      }
    }

    function attachCartLogic(){
      document.querySelectorAll('.add-to-cart').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const card  = btn.closest('.menu-card');
          const name  = card.querySelector('h3').textContent;
          const price = parseFloat(card.querySelector('span').textContent.replace('₹',''));
          const img   = card.querySelector('img').src;
          const item  = { id:name.replace(/\s+/g,'-').toLowerCase(), name, price, image:img, qty:1 };

          let cart = JSON.parse(localStorage.getItem('demoCart')||'{}');
          if(cart[item.id]) cart[item.id].qty+=1;
          else cart[item.id]=item;
          localStorage.setItem('demoCart',JSON.stringify(cart));

          btn.textContent='Added ✅'; btn.disabled=true;
          setTimeout(()=>{ btn.textContent='Add More'; btn.disabled=false; },1000);
          gsap.fromTo(btn,{scale:1.2},{scale:1,duration:0.3});
          updateCartButton();
        });
      });
    }

    function updateCartButton(){
      const cart  = JSON.parse(localStorage.getItem('demoCart')||'{}');
      const count = Object.values(cart).reduce((s,i)=>s+i.qty,0);
      document.getElementById('cartCount').textContent=count;
    }

    let currentRating = 0;
    
    async function loadReviews() {
      const reviewsList = document.getElementById('reviewsList');
      if(!hotelId || !reviewsList) return;
      try {
        const snap = await getDocs(collection(db, "hotels", hotelId, "reviews"));
        if(snap.empty) {
          reviewsList.innerHTML = "<p class='text-gray-400'>No reviews yet. Be the first to review!</p>";
          return;
        }
        reviewsList.innerHTML = '';
        
        let reviews = [];
        snap.forEach(doc => { reviews.push(doc.data()); });
        // Sort in memory by createdAt descending
        reviews.sort((a, b) => {
          const tA = a.createdAt ? a.createdAt.toMillis() : 0;
          const tB = b.createdAt ? b.createdAt.toMillis() : 0;
          return tB - tA;
        });

        reviews.forEach(r => {
          const stars = '⭐'.repeat(r.rating) + '☆'.repeat(5-r.rating);
          const dateStr = r.createdAt ? new Date(r.createdAt.toMillis()).toLocaleDateString() : 'Just now';
          
          const revCard = document.createElement('div');
          revCard.className = 'bg-black/20 border border-white/5 p-4 rounded-xl';
          revCard.innerHTML = `
            <div class="flex justify-between mb-1 items-center">
              <span class="font-bold text-pink-400 flex items-center gap-2">
                <div class="w-6 h-6 rounded-full bg-pink-500 text-white flex items-center justify-center text-xs">${(r.userName || 'A').charAt(0).toUpperCase()}</div>
                ${r.userName || 'Anonymous'}
              </span>
              <span class="text-xs text-gray-400">${dateStr}</span>
            </div>
            <div class="text-yellow-400 mb-2 tracking-widest text-xs">${stars}</div>
            <p class="text-gray-200 text-sm leading-relaxed">${r.text}</p>
          `;
          reviewsList.appendChild(revCard);
        });
      } catch (err) {
        console.error("Error loading reviews:", err);
        reviewsList.innerHTML = "<p class='text-red-400'>Error loading reviews.</p>";
      }
    }

    function setupReviewForm() {
      const stars = document.querySelectorAll('.star-btn');
      stars.forEach(star => {
        star.addEventListener('click', (e) => {
          currentRating = parseInt(e.target.getAttribute('data-value'));
          stars.forEach(s => {
            if(parseInt(s.getAttribute('data-value')) <= currentRating) {
              s.classList.remove('text-gray-500');
              s.classList.add('text-yellow-400');
            } else {
              s.classList.add('text-gray-500');
              s.classList.remove('text-yellow-400');
            }
          });
        });
      });

      const submitBtn = document.getElementById('submitReviewBtn');
      if(submitBtn) {
        submitBtn.addEventListener('click', async () => {
          if(currentRating === 0) {
            alert('Please select a star rating.');
            return;
          }
          const text = document.getElementById('reviewText').value.trim();
          if(!text) {
            alert('Please write a review text.');
            return;
          }
          const user = auth.currentUser;
          if(!user) {
            alert('You must be logged in to leave a review.');
            return;
          }
          submitBtn.textContent = 'Submitting...';
          submitBtn.disabled = true;

          try {
            await addDoc(collection(db, "hotels", hotelId, "reviews"), {
              userId: user.uid,
              userName: user.email ? user.email.split('@')[0] : 'User',
              rating: currentRating,
              text: text,
              createdAt: serverTimestamp()
            });
            document.getElementById('reviewText').value = '';
            currentRating = 0;
            stars.forEach(s => { s.classList.add('text-gray-500'); s.classList.remove('text-yellow-400'); });
            
            submitBtn.textContent = 'Submit Review';
            submitBtn.disabled = false;
            loadReviews(); // refresh
          } catch (err) {
            console.error("Error adding review:", err);
            alert('Error adding review.');
            submitBtn.textContent = 'Submit Review';
            submitBtn.disabled = false;
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded',()=>{ loadMenu(); updateCartButton(); loadReviews(); setupReviewForm(); });
  </script>
</head>

<body class="min-h-screen">
  <nav class="glass shadow-lg p-4 flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-pink-500 to-yellow-400 flex items-center justify-center text-lg font-extrabold text-white shadow-xl">F</div>
      <h1 class="text-2xl font-bold neon-text">Food Cart</h1>
    </div>
    <div class="flex gap-3">
      <a href="index.html"   class="px-4 py-2 rounded-lg text-white hover:bg-white/10 transition">🏠 Home</a>
      <a href="hotels.html"  class="px-4 py-2 rounded-lg text-white hover:bg-white/10 transition">🏨 Hotels</a>
      <a href="orders.html"  class="px-4 py-2 rounded-lg text-white hover:bg-white/10 transition">📦 Orders</a>
      <a href="profile.html" class="px-4 py-2 rounded-lg text-white hover:bg-white/10 transition">👤 Profile</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-10 px-4">
    <h2 id="hotelTitle" class="text-4xl font-extrabold text-center neon-text mb-3">Loading...</h2>
    <p class="text-center text-gray-300 mb-10">Explore our delicious menu below.</p>
    <div id="menuContainer" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <p class="text-gray-400 col-span-full text-center">Loading menu...</p>
    </div>
    
    <!-- Reviews Section -->
    <div class="mt-16 glass p-6 rounded-2xl shadow-xl max-w-4xl mx-auto">
      <h3 class="text-2xl font-bold text-white mb-6">Reviews & Ratings ⭐</h3>
      
      <!-- Existing Reviews -->
      <div id="reviewsList" class="space-y-4 mb-8 max-h-80 overflow-y-auto pr-2">
        <p class="text-gray-400">Loading reviews...</p>
      </div>

      <!-- Add Review Form -->
      <div class="border-t border-gray-600/50 pt-6">
        <h4 class="text-lg font-semibold text-white mb-3">Write a Review</h4>
        <div class="flex gap-1 mb-3" id="starRating">
          <span class="text-3xl cursor-pointer text-gray-500 star-btn transition" data-value="1">★</span>
          <span class="text-3xl cursor-pointer text-gray-500 star-btn transition" data-value="2">★</span>
          <span class="text-3xl cursor-pointer text-gray-500 star-btn transition" data-value="3">★</span>
          <span class="text-3xl cursor-pointer text-gray-500 star-btn transition" data-value="4">★</span>
          <span class="text-3xl cursor-pointer text-gray-500 star-btn transition" data-value="5">★</span>
        </div>
        <textarea id="reviewText" rows="3" class="w-full bg-black/30 text-white rounded-lg p-3 border border-gray-600 focus:outline-none focus:border-pink-500 mb-3 transition placeholder-gray-500" placeholder="What did you think about this place?"></textarea>
        <button id="submitReviewBtn" class="btn-primary px-6 py-2 rounded-lg text-sm w-full md:w-auto shadow-lg hover:shadow-pink-500/30">Submit Review</button>
      </div>
    </div>
  </main>

  <button id="cartBtn" onclick="window.location.href='cart.html'"
    class="fixed bottom-6 right-6 bg-pink-500 text-white p-4 rounded-full shadow-lg hover:scale-110 transition z-40">
    🛒 <span id="cartCount">0</span>
  </button>

  <footer class="text-center py-6 text-gray-400 text-sm">© Food Cart — Taste the Future 🍴</footer>
</body>
</html>
